[project]
name = "process_pdfs"
version = "0.1.0"
description = "A small ETL pipeline that extracts structured information from PDF files"
authors = [
  { name = "Carlos Eduardo Gomes Silva", email = "66494905+Kadugs@users.noreply.github.com" },
]
readme = "README.md"
requires-python = "3.9"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
ignore = ["F403", "W504"]
per-file-ignores = ["__init__.py:F401"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs", ".tox", ".venv"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
